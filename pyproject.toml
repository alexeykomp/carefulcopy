[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carefulcopy"
version = "0.1.0.dev0"
description = "Resumable, atomic file copying with retries, locks, throttling and pluggable backends (local, SMB)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
smb = ["smbprotocol>=1.10"]
keyring = ["keyring"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carefulcopy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
